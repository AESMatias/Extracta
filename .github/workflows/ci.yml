# Quality gates on every push and pull request, plus a weekly security scan of both images.
# A push to main that passes the backend and frontend gates is deployed to production.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays: catch newly published CVEs even without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry and dependencies
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-root --with dev --all-extras
      - run: poetry run ruff format --check app tests
      - run: poetry run ruff check app tests
      - run: poetry run mypy app tests
      - name: Tests (integration tests are skipped without real credentials)
        run: poetry run pytest

  frontend:
    name: Frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  images:
    name: Build and scan images (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -f docker/Dockerfile -t pdf-process-pipeline:ci .
          docker build -t extracta-frontend:ci frontend
          docker build -t extracta-certbot:ci docker/certbot
      - name: Scan the API/worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pdf-process-pipeline:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true # fail only on vulnerabilities that already have a fix
          exit-code: "1"
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: extracta-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the certbot image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: extracta-certbot:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Pushes to main only, and only once the server is set up (repository variable DEPLOY_HOST;
    # see docs/DEPLOY.md, "Automatic deploys"). Until then the job is skipped, not failed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    environment: production # listed under the repository's Deployments, like Vercel
    concurrency:
      group: production
      cancel-in-progress: false # never stop a deploy halfway; the next one waits
    steps:
      - name: Run deploy/deploy.sh on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server pins this key to deploy/deploy.sh in authorized_keys: it can run nothing else.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST"
