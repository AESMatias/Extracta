# Local mode (SITE_DOMAIN empty): plain HTTP on port 80, published as http://localhost:8080.

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/site.conf;
}
