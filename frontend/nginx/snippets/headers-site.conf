# Security headers for the website's pages and files.
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;
# 'unsafe-inline' scripts: a static Next.js export boots with inline scripts and a static site
# cannot use nonces. React escapes everything it renders, the app never injects HTML, and every
# other directive stays strict. PayPal is allowed for the checkout buttons.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.paypal.com https://www.sandbox.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.paypal.com https://*.paypalobjects.com; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com; frame-src https://*.paypal.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
