# The Extracta site: the static Next.js export plus the Flask API under /api.
# Included by both the plain-HTTP (local) and the HTTPS (production) server blocks.

root /usr/share/nginx/html;
error_page 404 /404.html;

# The API (Flask + gunicorn). Flask trusts X-Forwarded-* for exactly one hop (TRUSTED_PROXIES=1).
location /api/ {
    include /etc/nginx/snippets/headers-api.conf;

    # A variable makes Nginx resolve "web" at request time (see "resolver" in nginx.conf).
    set $api_upstream http://web:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;               # $http_host keeps the port (localhost:8080)
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;  # the real client; never trust one sent by it
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads stream straight to Flask instead of being buffered to disk first: memory and disk
    # stay flat, and Flask applies the exact per-plan limits. This cap is only the outer bound
    # (50 files x 50 MB, the largest plan).
    client_max_body_size 2600m;
    proxy_request_buffering off;
    proxy_read_timeout 130s;  # a little above gunicorn's 120 s timeout
    proxy_send_timeout 130s;
}

# Next.js build files have a content hash in their name: cache them for a year.
location /_next/static/ {
    include /etc/nginx/snippets/headers-site.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Pages: /login -> login.html, /admin -> admin.html, and so on. HTML is revalidated on every
# visit so a new deployment shows up at once.
location / {
    include /etc/nginx/snippets/headers-site.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/index.html =404;
}

location = /404.html {
    include /etc/nginx/snippets/headers-site.conf;
    internal;
}
