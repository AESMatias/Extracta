# Nginx main configuration: serves the static Next.js site and forwards /api to Flask.
# The site itself (plain HTTP locally, HTTPS in production) is written at start-up by
# 40-extracta-site.sh into /etc/nginx/conf.d/extracta.conf.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;  # no version number in headers or error pages
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;  # the image links these files to docker logs

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/javascript application/json application/xml image/svg+xml;

    # Docker's internal DNS, re-asked every 10 s: if the web container restarts with a new IP,
    # Nginx follows it instead of returning 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HSTS only over HTTPS: an empty value means Nginx does not send the header at all.
    map $scheme $hsts_header {
        https   "max-age=31536000";
        default "";
    }

    include /etc/nginx/conf.d/*.conf;
}
