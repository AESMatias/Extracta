[project]
name = "pdf-process-pipeline"
version = "0.1.0"
description = "Intelligent Document Processing: batch PDF upload, background LLM extraction, Supabase storage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3,<4",
    "gunicorn>=26.2.0,<27",
    "celery[redis]>=5.6.3,<6",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "pdfplumber>=0.11.10,<0.12",
    "sqlalchemy>=2.0.54,<2.1",
    "psycopg[binary]>=3.3.6,<4",
    # Default LLM provider (Gemini).
    "google-genai>=2.25.0,<3",
    "xlsxwriter (>=3.2,<4)",
    "alembic (>=1.20,<2)",
    "defusedxml (>=0.7.1,<0.8)",
    "pillow-heif (>=1.8.0,<2)",
]

[project.optional-dependencies]
# Alternative LLM provider. Install with: poetry install --extras openai
openai = ["openai>=3.19.2,<4"]

[tool.poetry]
# This is an application, not a library to publish on PyPI.
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.16.8"
mypy = "^2.3.1"
openpyxl = ">=3.1,<4"
types-defusedxml = "^0.7.0.20260504"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# 120 leaves room for short comments to the right of a line of code.
# The formatter counts those comments too, so a lower limit would wrap the code.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: talks to the real Supabase database (needs DATABASE_URL)"]
addopts = "--cov=app --cov-report=term-missing"
